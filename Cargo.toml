[package]
name = "cosmox-plugin-bangumi"
version = "0.0.1"
edition = "2024"
license = "GPL"
authors = ["niniconi"]
description = "Fetches anime metadata from Bangumi (bgm.tv)."

[package.metadata]
dependencies = ["cosmox-plugin-anime"]
conflicts = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmox-api = { git = "https://github.com/niniconi/cosmox.git", branch = "dev", package = "cosmox-api" }
cosmox-plugin-anime = { git = "https://github.com/niniconi/cosmox-plugin-anime.git", default-features = false }
serde = { version = "1.0.219", features = ["derive", "rc"] }
wasi = "0.14.7"
serde_json = "1.0.140"
url = "2.5.7"
log = "0.4.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
